const STATE_TEXT = {
  evaluated: "已评估",
  not_applicable: "不适用",
  uncovered: "未覆盖"
};
const STATUS_TEXT = {
  met: "满足", unmet: "未满足", subsumed: "已去重", not_required: "条件未成立"
};

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function verdictClass(v) {
  return v === "合规" ? "v-pass" : (v === "不合规" ? "v-fail" : "v-na");
}
function valCell(v) {
  if (v === true) return '<span class="yes">是</span>';
  if (v === false) return '<span class="no">否</span>';
  return esc(v);
}

// ---------- 左侧导航 ----------
function buildNav() {
  const nav = document.getElementById("nav");
  const groups = {};
  DATA.cases.forEach(c => {
    (groups[c.type] = groups[c.type] || []).push(c);
  });
  let html = "";
  Object.keys(groups).forEach(g => {
    // 分组标题
    html += '<div class="nav-group">' + esc(g) + '</div>';
    groups[g].forEach(c => {
      const cls = c.result.verdict === "合规" ? "green"
                : (c.result.verdict === "不合规" ? "red"
                : (c.result.state === "uncovered" ? "amber" : "gray"));
      html += '<button class="nav-item" data-id="' + esc(c.id) + '">'
            + '<span class="dot ' + cls + '"></span>'
            + '<span class="id">' + esc(c.id) + '</span>'
            + '<span class="nm">' + esc(c.short) + '</span></button>';
    });
  });
  nav.innerHTML = html;
  nav.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => showCase(btn.dataset.id));
  });
}

// ---------- 主体渲染 ----------
function showCase(id) {
  document.querySelectorAll(".nav-item").forEach(b => {
    b.classList.toggle("active", b.dataset.id === id);
  });
  const c = DATA.cases.find(x => x.id === id);
  if (!c) return;
  const r = c.result;
  let h = "";

  // 头部
  const cov = r.coverage || {};
  const covCls = cov.complete ? "cov-full" : "cov-part";
  h += '<div class="card"><div class="case-head"><div>'
     + '<div class="title">' + esc(c.id) + ' · ' + esc(c.desc) + '</div>'
     + '<div class="pills">'
     + '<span class="pill state-' + r.state + '">' + (STATE_TEXT[r.state] || r.state) + '</span>'
     + '<span class="pill ' + verdictClass(r.verdict) + '">'
     + esc(r.verdict_qualified || r.verdict) + '</span>'
     + '<span class="pill ' + covCls + '">已判定 ' + (cov.decided || 0) + '/' + (cov.total || 0) + ' 条规则</span>'
     + '</div>';
  if (cov.complete === false && r.state === "evaluated") {
    h += '<div class="cov-warn">⚠️ 有 ' + cov.undetermined
       + ' 条规则因触发字段缺失未能判定。本结论只覆盖已判定的 '
       + cov.decided + ' 条，<b>不等于全部合规</b>。</div>';
  }
  h += '</div></div></div>';

  // 输入字段
  const keys = Object.keys(c.input);
  h += '<div class="card"><h3>输入事实（' + keys.length + ' 项）</h3><table><thead><tr>'
     + '<th style="width:42%">字段</th><th>值</th></tr></thead><tbody>';
  keys.forEach(k => {
    h += '<tr><td class="mono">' + esc(k) + '</td><td>' + valCell(c.input[k]) + '</td></tr>';
  });
  h += '</tbody></table></div>';

  // 触发规则与义务
  if (r.obligations && r.obligations.length) {
    h += '<div class="card"><h3>触发的规则与义务（' + r.triggered_rules.length + ' 条规则）</h3>';
    r.obligations.forEach(pr => {
      const meta = DATA.rules[pr.rule_id] || {};
      h += '<div class="rule"><div class="rule-hd">'
         + '<span class="rid">' + esc(pr.rule_id) + '</span>'
         + '<span class="rtitle">' + esc(meta.title || "") + '</span>'
         + '<span class="art">' + esc(pr.article) + ' · ' + esc(meta.strength || "") + '</span>'
         + '</div>';
      pr.actions.forEach(a => {
        h += '<div class="act"><span class="st ' + a.status + '">'
           + (STATUS_TEXT[a.status] || a.status) + '</span><div class="body">'
           + '<div class="label">' + esc(a.label) + '</div>';
        if (a.missing && a.missing.length) {
          h += '<ul class="miss">';
          a.missing.forEach(m => { h += '<li>' + esc(m) + '</li>'; });
          h += '</ul>';
        }
        if (a.note) h += '<div class="note">' + esc(a.note) + '</div>';
        h += '</div></div>';
      });
      h += '</div>';
    });
    h += '</div>';
  }

  // 缺失材料
  if (r.missing_materials && r.missing_materials.length) {
    h += '<div class="card"><h3>缺失材料清单（去重后 ' + r.missing_materials.length + ' 项）</h3><ol class="missing">';
    r.missing_materials.forEach(m => { h += '<li>' + esc(m) + '</li>'; });
    h += '</ol></div>';
  }

  // 未触发 / 未判定（折叠，含原因）
  if (r.inactive_detail && r.inactive_detail.length) {
    h += '<div class="card"><h3>未触发 / 未判定的规则（' + r.inactive_detail.length + ' 条）</h3>';
    r.inactive_detail.forEach(d => {
      const meta = DATA.rules[d.rule_id] || {};
      h += '<details><summary><span class="rid mono" style="font-weight:600">' + esc(d.rule_id)
         + '</span><span style="color:#57606a">' + esc(meta.title || "")
         + '</span><span style="margin-left:auto;color:#8c959f;font-size:12px">'
         + esc(d.reason_text) + '</span></summary><div class="inner">';
      if (d.condition && d.condition.length) {
        h += '<table><thead><tr><th>触发字段</th><th>期望</th><th>实际</th><th>结果</th></tr></thead><tbody>';
        d.condition.forEach(it => {
          h += '<tr><td class="mono">' + esc(it.field) + '</td><td class="mono">'
             + esc(it.expected) + '</td><td class="mono">'
             + (it.present ? esc(it.actual) : '<span class="na">未提供</span>')
             + '</td><td>' + (it.ok === true ? '<span class="yes">通过</span>'
             : (it.ok === false ? '<span class="no">不通过</span>'
             : '<span class="na">未知</span>')) + '</td></tr>';
        });
        h += '</tbody></table>';
      }
      if (meta.not_applicable && meta.not_applicable.length) {
        h += '<p class="reason">不适用条件：' + meta.not_applicable.map(esc).join("；") + '</p>';
      }
      h += '</div></details>';
    });
    h += '</div>';
  }

  // 依据条文
  const arts = {};
  (r.triggered_rules || []).forEach(rid => {
    const m = DATA.rules[rid];
    if (m && m.quotes && m.quotes.length) arts[rid] = m;
  });
  if (Object.keys(arts).length) {
    h += '<div class="card"><h3>依据条文（逐字取自官方文本）</h3>';
    Object.keys(arts).forEach(rid => {
      const m = arts[rid];
      (m.quotes || []).forEach(q => {
        h += '<blockquote><div class="src">' + esc(q.article) + '　' + esc(rid)
           + (q.kind === "附加依据" ? ' · 附加依据' : '') + '</div>'
           + esc(q.quote) + '</blockquote>';
      });
    });
    h += '</div>';
  }

  // 说明
  if (r.notes && r.notes.length) {
    h += '<div class="card"><h3>引擎说明</h3><ul style="margin:0;padding-left:20px;color:#57606a">';
    r.notes.forEach(n => { h += '<li>' + esc(n) + '</li>'; });
    h += '</ul></div>';
  }

  document.getElementById("main").innerHTML = h;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("f-rules").textContent = "v" + DATA.meta.rules_version;
document.getElementById("f-time").textContent = DATA.meta.generated_at;
buildNav();
showCase(DATA.cases[0].id);
</script>
